name: lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 文書を検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7
      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 依存関係をインストール
        run: npm ci
      - name: 文書を検査
        run: npm run verify

